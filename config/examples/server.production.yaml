# Production example — copy to config/server.yaml and review before deployment.
# Requires certificates generated by scripts/generate_certificates.py and the
# password environment variables referenced below.
config_version: 1
profile: production
name: DTL Local OPC UA Server Test
endpoint: opc.tcp://0.0.0.0:4841/server/
application_uri: urn:freeopcua:python:server
product_uri: urn:glados:opcua:server
manufacturer_name: GLaDOS
log_level: INFO
log_json: true

security:
  policies: [Basic256Sha256_SignAndEncrypt, Aes128Sha256RsaOaep_SignAndEncrypt]
  identity_tokens: [Username]
  allow_anonymous: false
  allow_insecure_legacy: false
  certificate: certificates/server.pem
  private_key: certificates/server.key
  users:
    - {username: admin, role: admin, password_env: GLADOS_PASSWORD_ADMIN}
    - {username: health, role: monitor, password_env: GLADOS_PASSWORD_HEALTH}
    # Scope wrappers to their own equipment; null scope means all equipment.
    # - {username: wrapper-robot1, role: device,
    #    password_env: GLADOS_PASSWORD_WRAPPER_ROBOT1, equipment: [robot1]}
    # - {username: cell-controller, role: controller,
    #    password_env: GLADOS_PASSWORD_CONTROLLER}

health:
  enabled: true
  namespace: 54
  uri: urn:glados:opcua:health
  stale_after_seconds: 30
  poll_interval_seconds: 5
