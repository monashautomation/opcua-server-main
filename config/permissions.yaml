# Production authorization matrix, enforced at the OPC UA service boundary.
#
# `enforced: false` is required by the legacy compatibility profile. Set it to
# true together with GLADOS_PROFILE=production.
#
# Node ownership comes from each variable's `writer` field in config/devices/.
#   device      wrappers write their own telemetry, feedback and status
#   controller  controllers write commands
#   admin       ownership not yet confirmed; admin-only until reviewed
# `denied` patterns are fnmatch expressions on canonical NodeIds and win over
# the role matrix. A write request containing any denied NodeId fails as a whole.
enforced: false
roles:
  admin:
    read: true
    write_all: true
  controller:
    read: true
    write_by_writer: [controller]
  device:
    read: true
    write_by_writer: [device]
  monitor:
    read: true
    write_by_writer: []
denied: []
