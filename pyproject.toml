[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glados-opcua"
version = "2.0.0"
description = "Configuration-driven GLaDOS OPC UA server with frozen legacy compatibility"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "GLaDOS project contributors" }]
dependencies = [
    "asyncua==1.1.8",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
glados-opcua = "glados_opcua.__main__:main"
glados-opcua-docs = "glados_opcua.docs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
